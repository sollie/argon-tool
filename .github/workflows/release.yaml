name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: argon-tool-linux-amd64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: argon-tool-linux-arm64

          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: argon-tool-macos-amd64

          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: argon-tool-macos-arm64

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: argon-tool-windows-amd64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.96.1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: matrix.runner != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/argon-tool ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: matrix.runner == 'windows-latest'
        run: cp target/${{ matrix.target }}/release/argon-tool.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: cliff
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2
        with:
          config: .github/cliff.toml
          args: --current --strip header

  release:
    name: Release
    needs: [build, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.content }}
          files: |
            argon-tool-linux-amd64
            argon-tool-linux-arm64
            argon-tool-macos-amd64
            argon-tool-macos-arm64
            argon-tool-windows-amd64.exe
