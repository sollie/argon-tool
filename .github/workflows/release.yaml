name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: argon-tool-linux-amd64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: argon-tool-linux-arm64

          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: argon-tool-macos-amd64

          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: argon-tool-macos-arm64

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: argon-tool-windows-amd64.exe

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1.96.1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: matrix.runner != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/argon-tool ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: matrix.runner == 'windows-latest'
        run: cp target/${{ matrix.target }}/release/argon-tool.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: .github/cliff.toml
          args: --current --strip header

  release:
    name: Release
    needs: [build, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.content }}
          files: |
            argon-tool-linux-amd64
            argon-tool-linux-arm64
            argon-tool-macos-amd64
            argon-tool-macos-arm64
            argon-tool-windows-amd64.exe
